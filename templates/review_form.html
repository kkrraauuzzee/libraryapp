{% extends 'base.html' %}

{% block title %}Написать рецензию - Электронная библиотека{% endblock %}

{% block content %}
<h1>Написать рецензию для «{{ book.title }}»</h1>

<p class="text-muted">Выберите оценку и напишите текст рецензии.</p>

<form method="post">
    <div class="mb-3">
        <label for="rating" class="form-label">Оценка</label>
        <select class="form-select" id="rating" name="rating" required>
            <option value="5" selected>5 - отлично</option>
            <option value="4">4 - хорошо</option>
            <option value="3">3 - удовлетворительно</option>
            <option value="2">2 - неудовлетворительно</option>
            <option value="1">1 - плохо</option>
            <option value="0">0 - ужасно</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="text" class="form-label">Текст рецензии</label>
        <textarea class="form-control" id="text" name="text" rows="7" required></textarea>
        <div class="form-text">Можно использовать Markdown: **жирный текст**, списки, заголовки.</div>
    </div>

    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a class="btn btn-secondary" href="{{ url_for('view_book', book_id=book.id) }}">Отменить</a>
</form>
{% endblock %}
